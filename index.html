<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ניהול הוצאות</title>

<!-- ===== הגדרות אפליקציה (PWA) למסך הבית באייפון ===== -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="הוצאות">
<meta name="theme-color" content="#131313">
<!-- אייקון SVG מוטמע: עיגול ירוק עם האותיות ט' ר' -->
<link rel="apple-touch-icon" href="vault-icon.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#131313;
    --panel:#1c1c1e;
    --panel-2:#262628;
    --border:#38383a;
    --text:#ececec;
    --muted:#9a9a9e;
    --accent:#1fbf9f;
    --accent-dark:#17a68a;
    --p1:#ec5a8f;      /* טל - ורוד */
    --p1-bg:rgba(236,90,143,.12);
    --p2:#4f8ff7;      /* רון - כחול */
    --p2-bg:rgba(79,143,247,.12);
    --gold:#f5a623;
    --red:#ef5a5a;
    --radius:14px;
    --bg-image:url("https://images.unsplash.com/photo-1666126452579-f032d653c7f1?fm=jpg&q=80&w=2000&auto=format&fit=crop");
  }
  html.light{
    --bg:#f4f6fb;
    --panel:#ffffff;
    --panel-2:#eef1f8;
    --border:#dde3f0;
    --text:#1c2333;
    --muted:#6b7590;
    background-color:#dfe4ee;
  }
  html.pink{
    --bg:#fdf0f5;
    --panel:#fff5f9;
    --panel-2:#fce4ee;
    --border:#f6cede;
    --text:#5a2a3f;
    --muted:#a56b83;
    --accent:#e8629a;
    --accent-dark:#d14a84;
    background-color:#f3c9dc;
  }
  *{box-sizing:border-box;}
  html{
    overflow-x:hidden;overscroll-behavior-x:none;
    background:var(--bg-image) center/cover no-repeat fixed;
    background-color:var(--bg);
  }
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;color:var(--text);transition:color .2s;
    overflow-x:hidden;overscroll-behavior-x:none;position:relative;
    min-height:100vh;min-height:100dvh;
  }
  /* שכבת התמונה עם הגברת צבע וחדות */
  body::before{
    content:"";position:fixed;inset:0;z-index:-2;
    background:var(--bg-image) center/cover no-repeat;
    filter:saturate(1.35) contrast(1.12) brightness(1.03);
  }
  /* שכבת כיסוי + וינייטה (הכהיה עדינה בקצוות) */
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.45) 100%),
      linear-gradient(180deg, rgba(19,19,19,.55), rgba(19,19,19,.64));
  }
  html.light body::after{
    background:
      radial-gradient(ellipse at center, transparent 50%, rgba(120,130,150,.28) 100%),
      linear-gradient(180deg, rgba(244,246,251,.62), rgba(244,246,251,.70));
  }
  html.pink body::after{
    background:
      radial-gradient(ellipse at center, transparent 48%, rgba(150,60,100,.30) 100%),
      linear-gradient(180deg, rgba(251,225,238,.52), rgba(246,197,220,.60));
  }
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  .themeToggle{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:8px 12px;font-size:13px;display:flex;align-items:center;gap:6px;justify-content:center;
  }

  /* ---------- LOGIN / SETUP ---------- */
  #loginScreen, #setupScreen{
    min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    background-color:#1a2433;
    background:
      linear-gradient(180deg, rgba(10,20,35,.25), rgba(10,20,35,.5)),
      var(--bg-image) center/cover no-repeat;
  }
  #loginScreen .box, #setupScreen .box{
    background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.5);border-radius:var(--radius);
    padding:36px;width:320px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25);
  }
  #loginScreen h1, #setupScreen h1{font-size:22px;margin:0 0 6px;color:#2a2118;}
  #loginScreen p, #setupScreen p{color:#8a7a68;font-size:13px;margin:0 0 20px;}
  #loginScreen input, #setupScreen input{
    width:100%;padding:12px 14px;border-radius:10px;border:1px solid #e8dcc8;
    background:#fbf6ee;color:#2a2118;font-size:16px;margin-bottom:12px;text-align:center;
  }
  #loginScreen button, #setupScreen button{
    width:100%;padding:12px;border-radius:10px;border:none;background:var(--accent);color:#04231c;
    font-weight:700;font-size:15px;
  }
  #loginError, #setupError{color:var(--red);font-size:13px;min-height:18px;}
  #setupScreen{display:none;}
  /* Toasts */
  #toastContainer{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:100%;max-width:400px;padding:0 12px;}
  .toast{pointer-events:auto;background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:12px 18px;font-size:14px;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;align-items:center;gap:10px;min-width:200px;max-width:100%;opacity:0;transform:translateY(-20px);transition:opacity .3s,transform .3s;}
  .toast.show{opacity:1;transform:translateY(0);}
  .toast.success{border-inline-start:4px solid var(--accent);}
  .toast.error{border-inline-start:4px solid var(--red);}
  .toast.info{border-inline-start:4px solid var(--gold);}
  .toast .tIcon{font-size:18px;flex-shrink:0;}
  /* Ripple */
  .rippleWrap{position:relative;overflow:hidden;}
  .rippleDot{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rippleAnim .55s ease-out;pointer-events:none;}
  @keyframes rippleAnim{to{transform:scale(2.5);opacity:0;}}
  /* Tab fade */
  .content.tabFade{animation:tabFadeIn .28s ease-out;}
  @keyframes tabFadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  #vaultTransition{
    display:none;position:fixed;inset:0;z-index:9999;
    background:#131313;align-items:center;justify-content:center;
  }
  #vaultTransition.show{display:flex;}
  #vaultAnimSvg{width:min(70vw,300px);height:min(70vw,300px);}

  /* ---------- APP LAYOUT ---------- */
  #app{display:none;min-height:100vh;width:100%;max-width:100vw;overflow-x:hidden;overscroll-behavior-y:contain;}
  .layout{display:flex;min-height:100vh;width:100%;max-width:100vw;}
  .content{flex:1;padding:28px 32px;max-width:900px;min-width:0;}
  .sidebar{
    width:220px;background:var(--panel);border-inline-start:1px solid var(--border);
    padding:24px 18px;display:flex;flex-direction:column;
  }
  .sidebar .who{margin-bottom:26px;}
  .sidebar .who .name{color:var(--accent);font-weight:700;font-size:17px;}
  .sidebar .who .sub{color:var(--muted);font-size:12px;margin-top:2px;}
  .navbtn{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 14px;border-radius:10px;border:none;background:transparent;color:var(--text);
    font-size:15px;text-align:right;margin-bottom:4px;width:100%;
  }
  .navbtn.active{background:var(--accent);color:#04231c;font-weight:700;}
  .navbtn:not(.active):hover{background:var(--panel-2);}
  .credit{margin-top:auto;color:var(--muted);font-size:11px;text-align:center;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .greeting{font-size:20px;font-weight:600;color:var(--accent);margin-bottom:14px;}
  .topbar h2{font-size:26px;margin:0;}
  .monthNav{display:flex;align-items:center;gap:10px;}
  .monthNav button{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;width:34px;height:34px;font-size:16px;}
  .monthNav .label{font-weight:700;font-size:16px;min-width:90px;text-align:center;}
  .addBtn{background:var(--accent);color:#04231c;border:none;border-radius:10px;padding:10px 18px;font-weight:700;font-size:14px;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
  .card .lbl{color:var(--muted);font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:6px;justify-content:space-between;}
  .card .val{font-size:22px;font-weight:800;}
  .val.green{color:var(--accent);}
  .val.red{color:var(--red);}
  .val.p1{color:var(--p1);}
  .val.p2{color:var(--p2);}
  .val.gold{color:var(--gold);}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;}
  .panel h3{margin:0 0 16px;font-size:16px;}
  .progressBar{height:9px;background:var(--panel-2);border-radius:6px;overflow:hidden;margin:10px 0;}
  .progressBar > div{height:100%;background:linear-gradient(90deg,var(--accent-dark),var(--accent));}
  .progressRow{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);}
  .vaultWrap{display:flex;justify-content:center;padding:10px 0;}
  .vaultSvg{width:280px;height:280px;max-width:100%;}

  .filterRow{display:flex;gap:8px;margin-bottom:14px;}
  .chip{padding:7px 16px;border-radius:20px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:13px;}
  .chip.active{background:var(--accent);color:#04231c;border-color:var(--accent);font-weight:700;}

  .listRow{
    display:flex;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--border);
  }
  .listRow:last-child{border-bottom:none;}
  .listRow .who{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
  .listRow .who.p1{background:var(--p1-bg);}
  .listRow .who.p2{background:var(--p2-bg);}
  .listRow .info{flex:1;padding:0 12px;}
  .listRow .info .cat{font-weight:600;font-size:14px;}
  .listRow .info .notes{color:var(--muted);font-size:12px;margin-top:2px;}
  .listRow .amt{font-weight:700;font-size:15px;}
  .listRow .amt.red{color:var(--red);}
  .listRow .amt.green{color:var(--accent);}
  .delBtn{background:rgba(239,90,90,.1);border:1px solid rgba(239,90,90,.3);color:var(--red);font-size:15px;padding:6px 10px;border-radius:8px;margin-inline-start:8px;flex-shrink:0;}
  .editBtn{background:var(--panel-2);border:1px solid var(--border);font-size:15px;padding:6px 10px;border-radius:8px;margin-inline-start:8px;flex-shrink:0;}
  .delBtn:hover{background:rgba(239,90,90,.25);}
  .empty{text-align:center;color:var(--muted);padding:50px 10px;}
  .empty .big{font-size:15px;margin-bottom:6px;color:var(--text);}

  /* ---------- MODAL ---------- */
  .modalOverlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;z-index:50;
  }
  .modalOverlay.show{display:flex;}
  .modal{
    background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:26px 28px;width:340px;max-width:90vw;
    max-height:88vh;overflow-y:auto;
  }
  .modal .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .modal h3{margin:0;font-size:18px;}
  .modal .close{background:none;border:none;color:var(--muted);font-size:20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .tripCatsScroll{max-height:220px;overflow-y:auto;padding-inline-end:6px;margin-bottom:8px;}
  .field input,.field select{
    width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:14px;
  }
  .saveBtn{width:100%;padding:12px;border-radius:10px;border:none;background:var(--accent);color:#04231c;font-weight:700;font-size:15px;margin-top:4px;}
  .modalMsg{font-size:13px;color:var(--red);min-height:16px;margin-top:8px;text-align:center;}

  .chartWrap{position:relative;height:260px;}
  .chatBox{display:flex;flex-direction:column;gap:12px;max-height:480px;overflow-y:auto;padding:6px 2px;margin-bottom:14px;}
  .chatMsg{max-width:80%;padding:12px 16px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;}
  .chatMsg.user{align-self:flex-end;background:var(--accent);color:#04231c;font-weight:600;}
  .chatMsg.ai{align-self:flex-start;background:var(--panel-2);border:1px solid var(--border);}
  .chatMsg.loading{align-self:flex-start;color:var(--muted);font-style:italic;}
  .waShare{display:block;margin-top:8px;background:rgba(37,211,102,.15);border:1px solid rgba(37,211,102,.4);color:#25d366;border-radius:8px;padding:5px 10px;font-size:12px;}
  .waShare:hover{background:rgba(37,211,102,.28);}
  .chatInputRow{display:flex;gap:10px;}
  .chatInputRow input{flex:1;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:14px;}
  .chatInputRow button{background:var(--accent);color:#04231c;border:none;border-radius:10px;padding:0 20px;font-weight:700;}
  .chatEmpty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px;}
  .chatSuggestions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .chatSuggestions button{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:20px;padding:8px 14px;font-size:13px;}
  .waRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .waRow select{flex:1;min-width:130px;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:14px;}
  .themeGrid{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;}
  .themeCard{flex:1;min-width:130px;border:2px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;text-align:center;transition:border-color .15s;}
  .themeCard:hover{border-color:var(--accent);}
  .themeCard.active{border-color:var(--accent);background:var(--panel-2);}
  .themePreview{border-radius:10px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--border);margin-bottom:10px;}
  .themeName{font-weight:600;font-size:15px;}
  .themeCheck{color:var(--accent);font-size:13px;font-weight:600;margin-top:4px;}
  .bgGrid{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;}
  .bgCard{flex:1;min-width:130px;max-width:180px;border:2px solid var(--border);border-radius:14px;padding:8px;cursor:pointer;text-align:center;transition:border-color .15s,transform .15s;}
  .bgCard:hover{border-color:var(--accent);transform:translateY(-2px);}
  .bgCard.active{border-color:var(--accent);background:var(--panel-2);}
  .bgPreview{border-radius:10px;height:90px;background-size:cover;background-position:center;border:1px solid var(--border);margin-bottom:8px;}
  .bgName{font-weight:600;font-size:13px;}
  .bgCheck{color:var(--accent);font-size:12px;font-weight:600;margin-top:2px;}
  .budgetTableWrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .budgetTable{width:100%;border-collapse:collapse;margin-top:10px;}
  .budgetTable th{text-align:right;color:var(--muted);font-size:13px;padding:8px;border-bottom:1px solid var(--border);}
  .budgetTable td{padding:8px;border-bottom:1px solid var(--border);font-size:14px;}
  .budgetInput{padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:14px;width:80px;}
  .tripGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
  .tripCard{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
  .tripHead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
  .tripName{font-weight:700;font-size:17px;}
  .tripWhere{color:var(--muted);font-size:13px;margin-top:2px;}
  .tripItems{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .tripItem{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid var(--border);}
  .tripTotal{font-weight:700;font-size:16px;color:var(--accent);text-align:left;padding-top:8px;border-top:2px solid var(--border);}
  .catList{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
  .catChip{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--border);border-radius:20px;padding:7px 12px;font-size:14px;}
  .catChip button{background:none;border:none;color:var(--red);font-size:14px;padding:0;line-height:1;}
  .catAddRow{display:flex;gap:10px;margin-top:10px;}
  .catAddRow input{flex:1;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:15px;}
  .noteTag{display:inline-block;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--muted);margin-inline-start:6px;font-weight:normal;}
  .insightsPanel{display:flex;flex-direction:column;gap:8px;}
  .insightRow{display:flex;align-items:center;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--panel-2);}
  .insightRow.warn{border-inline-start:3px solid var(--red);}
  .insightRow.near{border-inline-start:3px solid var(--gold);}
  .insightRow.good{border-inline-start:3px solid var(--accent);}
  .wishCheck{background:none;border:none;font-size:20px;padding:0;flex-shrink:0;}
  .wishLink{text-decoration:none;font-size:18px;}
  .listRow.wishDone .cat{text-decoration:line-through;color:var(--muted);}
  .goalGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:14px;}
  .goalCard{background:var(--panel-2);border:2px solid var(--border);border-radius:12px;padding:16px;}
  .goalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .goalHead b{font-size:16px;}
  .goalVaultWrap{display:flex;justify-content:center;padding:6px 0;}
  .goalVaultSvg{width:280px;height:280px;max-width:100%;}
  .miniBtn{margin-top:10px;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:13px;width:100%;}
  .miniBtn:hover{background:var(--accent);color:#04231c;}
  @media (max-width:720px){
    .layout{flex-direction:column;}
    .sidebar{
      width:100%;flex-direction:row;align-items:center;
      gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
      padding:10px 12px;
      padding-top:calc(10px + env(safe-area-inset-top));
      position:sticky;top:0;z-index:100;
      border-inline-start:none;border-bottom:1px solid var(--border);
      background:var(--panel);
    }
    .sidebar::-webkit-scrollbar{display:none;}
    .sidebar .who,.credit{display:none;}
    .navbtn{
      width:auto;white-space:nowrap;flex-shrink:0;
      padding:12px 16px;font-size:15px;margin-bottom:0;
    }
    .themeToggle{flex-shrink:0;white-space:nowrap;margin-top:0 !important;}
    .content{padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));}
    .topbar h2{font-size:22px;}
    .greeting{font-size:18px;}
    .vaultSvg,.goalVaultSvg{width:260px;height:260px;}
    .budgetTable th,.budgetTable td{padding:6px 4px;font-size:12px;}
    .budgetInput{width:64px;padding:6px;font-size:13px;}
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="box">
    <h1>ניהול הוצאות 💰</h1>
    <p id="loginGreeting">הזינו את הסיסמה המשותפת כדי להיכנס</p>
    <input type="password" id="pwInput" placeholder="סיסמה" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">כניסה</button>
    <div id="loginError"></div>
  </div>
</div>

<!-- ============ הגדרה ראשונית (רק בכניסה הראשונה לאתר) ============ -->
<div id="setupScreen">

<script>
/* =========================================================
   הגדרות - חובה להחליף בכתובת ה-URL של הפריסה (Deploy) שלכם
   אחרי שהרצתם setup ופרסתם את ה-Apps Script כ-Web app
   ========================================================= */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwtkca8JlOJC_dWOiB2OezBDbtTfx23TdMtITVi6uWp9gFYsgTMJhE8BbAS7EosUoy6/exec";
if(window.ChartDataLabels){ Chart.register(ChartDataLabels); Chart.defaults.set('plugins.datalabels', {display:false}); }
// אנימציה גלובלית פשוטה ובטוחה - כל הגרפים מונפשים בכניסה
if(window.Chart){
  Chart.defaults.animation.duration = 500;
  Chart.defaults.animation.easing = 'easeOutQuart';
  // עיצוב אחיד ל-tooltip בכל הגרפים
  Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(0,0,0,.85)';
  Chart.defaults.plugins.tooltip.titleColor = '#fff';
  Chart.defaults.plugins.tooltip.bodyColor = '#fff';
  Chart.defaults.plugins.tooltip.padding = 11;
  Chart.defaults.plugins.tooltip.cornerRadius = 8;
  Chart.defaults.plugins.tooltip.titleFont = { size: 13, weight: 'bold' };
  Chart.defaults.plugins.tooltip.bodyFont = { size: 13 };
  Chart.defaults.plugins.tooltip.displayColors = true;
  Chart.defaults.plugins.tooltip.boxPadding = 4;
}

const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const HEART = {p1:'💗', p2:'💙'};

let STATE = {
  data: null,          // { expenses, income, savings, settings }
  person1: '',
  person2: '',
  goal: 135605,
  categories: [],
  password: '',
  currentTab: 'dashboard',
  currentMonth: new Date().getMonth(), // 0-11
  currentYear: new Date().getFullYear(),
  expenseFilter: 'all', // all | p1 | p2
  aiMessages: [], // {role:'user'|'ai', text}
  forecastPerson: null, // מי נבחר בטאב התחזית
  editCategories: null, // עותק זמני לעריכת קטגוריות
  projCompany: null // החברה הנבחרת בתחזית התשואה
};

/* ---------- כניסה ---------- */
function doLogin(){
  const pw = document.getElementById('pwInput').value.trim();
  if(!pw){ setLoginError('נא להזין סיסמה'); return; }
  attemptLogin(pw, true);
}

// הגיליון שלכם שומר עמודות בעברית (תאריך/סכום/קטגוריה/מי/הערות וכו').
// הפונקציה הזו ממפה אותן לשמות פנימיים אחידים כדי שכל שאר הקוד יישאר פשוט.
function normalizeData(res){
  res.expenses = (res.expenses||[]).map(r => ({
    Date: r['תאריך'], Amount: r['סכום'], Category: r['קטגוריה'], Person: r['מי'], Notes: r['הערות'], Id: r['מזהה']
  }));
  res.income = (res.income||[]).map(r => ({
    Date: r['תאריך'], Person: r['מי'], Gross: r['ברוטו'], Net: r['נטו'], Id: r['מזהה']
  }));
  res.savings = (res.savings||[]).map(r => ({
    Date: r['תאריך'], Person: r['מי'], Amount: r['סכום'], Id: r['מזהה']
  }));
  res.forecast = (res.forecast||[]).map(r => ({
    Person: r['מי'], Month: Number(r['חודש']), Type: r['סוג'], Amount: Number(r['סכום'])
  }));
  res.budgets = (res.budgets||[]).map(r => ({
    Person: r['מי'], Category: r['קטגוריה'], Amount: Number(r['תקציב_חודשי'])
  }));
  res.trips = (res.trips||[]).map(r => ({
    TripId: r['מזהה_טיול'], Name: r['שם'], Location: r['מיקום'], Destination: r['יעד'],
    Category: r['קטגוריה'], Amount: Number(r['סכום']), Date: r['תאריך']
  }));
  res.investments = (res.investments||[]).map(r => ({
    Date: r['תאריך'], Person: r['מי'], Company: r['חברה'], Amount: Number(r['סכום']), Id: r['מזהה']
  }));
  res.assets = (res.assets||[]).map(r => ({
    Type: r['סוג'], Name: r['שם'], Amount: Number(r['סכום']), Id: r['מזהה']
  }));
  res.wishlist = (res.wishlist||[]).map(r => ({
    Item: r['פריט'], Price: Number(r['מחיר']), Link: r['קישור'], Bought: r['נקנה']==='כן', Id: r['מזהה']
  }));
  res.goals = (res.goals||[]).map(r => ({
    Name: r['שם'], Target: Number(r['יעד']), Saved: Number(r['נחסך']), Id: r['מזהה']
  }));
  res.fixedExpenses = (res.fixedExpenses||[]).map(r => ({
    Name: r['שם'], Amount: Number(r['סכום']), Person: r['מי'], Id: r['מזהה']
  }));
  return res;
}

async function attemptLogin(pw, animate){
  setLoginError('בודק...');
  try{
    const raw = await fetchData(pw);
    if(raw.error){ setLoginError(raw.error); sessionStorage.removeItem('budget_pw'); return; }
    const res = normalizeData(raw);
    STATE.data = res;
    STATE.password = pw;
    STATE.person1 = res.settings.Person1 || '';
    STATE.person2 = res.settings.Person2 || '';
    STATE.goal = Number(res.settings.AnnualGoal) || 135605;
    STATE.categories = (res.settings.Categories || '').split(',').map(s=>s.trim()).filter(Boolean);
    sessionStorage.setItem('budget_pw', pw);
    showApp(animate);
  }catch(err){
    setLoginError('שגיאה בטעינת הנתונים. בדקו את הכתובת (URL) בקוד.');
    console.error(err);
  }
}

function setLoginError(msg){ document.getElementById('loginError').textContent = msg; }

async function fetchData(pw){
  const url = APPS_SCRIPT_URL + '?action=getAll&password=' + encodeURIComponent(pw) + '&_=' + Date.now();
  const res = await fetch(url);
  if(!res.ok) throw new Error('fetch failed');
  return res.json();
}

async function postData(payload){
  payload.password = STATE.password;
  const res = await fetch(APPS_SCRIPT_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // נמנע מ-CORS preflight מול Apps Script
    body: JSON.stringify(payload)
  });
  return res.json();
}

function showApp(withAnimation){
  document.getElementById('sidebarNames').textContent = STATE.person1 + ' ו' + STATE.person2 + ' 🪙';
  if(withAnimation){
    playVaultTransition();
  } else {
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('app').style.display='block';
    goTab('dashboard');
  }
}

// אנימציית כספת נפתחת - הגלגל מסתובב, הדלת נפתחת, ואז האתר מופיע
function playVaultTransition(){
  const overlay = document.getElementById('vaultTransition');
  const wheel = document.getElementById('vtWheel');
  const door = document.getElementById('vtDoor');
  const money = document.getElementById('vtMoney');
  // מסתירים את מסך הכניסה מתחת לאוברליי
  overlay.classList.add('show');

  // 1. הגלגל מסתובב
  wheel.animate([{transform:'rotate(0deg)'},{transform:'rotate(-360deg)'}],
    {duration:800, easing:'ease-in-out', fill:'forwards'});

  // 2. הדלת נפתחת + שק כסף מופיע
  setTimeout(()=>{
    door.animate([
      {transform:'perspective(700px) rotateY(0deg)', opacity:1},
      {transform:'perspective(700px) rotateY(-78deg)', opacity:0.25}
    ],{duration:750, easing:'ease-in', fill:'forwards'});
    money.animate([
      {opacity:0, transform:'scale(0.3)'},
      {opacity:1, transform:'scale(1)'}
    ],{duration:600, delay:350, easing:'ease-out', fill:'forwards'});
  }, 800);

  // 3. מחליפים את מסך הנעילה באתר *מאחורי* האוברליי (כדי שלא יהבהב), ואז דוהים
  setTimeout(()=>{
    // קודם מחליפים למטה - כשהאוברליי עוד מכסה הכל
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('app').style.display='block';
    goTab('dashboard');
    // עכשיו דוהים את האוברליי וחושפים את האתר (לא את מסך הנעילה)
    overlay.animate([{opacity:1},{opacity:0}],{duration:450, easing:'ease-out', fill:'forwards'})
      .onfinish = ()=>{
        overlay.classList.remove('show');
        overlay.style.opacity='';
      };
  }, 1950);
}

// ניסיון כניסה אוטומטי אם יש סיסמה שמורה מהפעם הקודמת בדפדפן הזה
window.addEventListener('DOMContentLoaded', async ()=>{
  updateThemeBtn();
  const g = document.getElementById('loginGreeting');
  if(g) g.innerHTML = '<span style="font-size:18px;font-weight:600;color:#2a2118;">' + timeGreeting() + ' ' + greetingEmoji() + '</span><br><span style="font-size:12px;opacity:.8;">הזינו את הסיסמה המשותפת כדי להיכנס</span>';

  // בדיקה חד-פעמית: האם האתר הזה עדיין לא הוגדר (שמות+סיסמה)? אם כן, מציגים
  // מסך היכרות קצר במקום מסך הכניסה הרגיל.
  try{
    const checkRes = await fetch(APPS_SCRIPT_URL + '?action=checkSetup&_=' + Date.now());
    const checkData = await checkRes.json();
    if(checkData && checkData.needsSetup){
      document.getElementById('loginScreen').style.display='none';
      document.getElementById('setupScreen').style.display='flex';
      return;
    }
  }catch(err){
    console.error('checkSetup failed', err);
  }

  const saved = sessionStorage.getItem('budget_pw');
  if(saved){ document.getElementById('pwInput').value = saved; attemptLogin(saved); }
});

function setSetupError(msg){ document.getElementById('setupError').textContent = msg; }

async function doFirstTimeSetup(){
  const p1 = document.getElementById('setupName1').value.trim();
  const p2 = document.getElementById('setupName2').value.trim();
  const pw1 = document.getElementById('setupPw1').value;
  const pw2 = document.getElementById('setupPw2').value;
  if(!p1 || !p2){ setSetupError('נא למלא את שני השמות'); return; }
  if(!pw1){ setSetupError('נא לבחור סיסמה'); return; }
  if(pw1 !== pw2){ setSetupError('הסיסמאות לא תואמות'); return; }
  setSetupError('שומר...');
  try{
    const res = await postData({type:'firstTimeSetup', person1:p1, person2:p2, newPassword:pw1});
    if(res.error){ setSetupError(res.error); return; }
    document.getElementById('setupScreen').style.display='none';
    document.getElementById('loginScreen').style.display='flex';
    document.getElementById('pwInput').value = pw1;
    await attemptLogin(pw1, true);
  }catch(err){
    setSetupError('שגיאה בשמירה. נסו שוב.');
    console.error(err);
  }
}

/* ---------- ניווט בין טאבים ---------- */
function goTab(tab){
  STATE.currentTab = tab;
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  render();
}

async function refreshData(){
  try{ STATE.data = normalizeData(await fetchData(STATE.password)); }catch(e){ console.error(e); }
}

function changeMonth(delta){
  let m = STATE.currentMonth + delta;
  let y = STATE.currentYear;
  if(m<0){ m=11; y--; }
  if(m>11){ m=0; y++; }
  STATE.currentMonth = m; STATE.currentYear = y;
  render();
}

/* ---------- עזרי נתונים ---------- */
function rowDate(r){ return new Date(r.Date); }
function inCurrentMonth(r){
  const d = rowDate(r);
  return d.getMonth()===STATE.currentMonth && d.getFullYear()===STATE.currentYear;
}
function inCurrentYear(r){ return rowDate(r).getFullYear()===STATE.currentYear; }

function monthExpenses(){ return (STATE.data.expenses||[]).filter(inCurrentMonth); }
function yearExpenses(){ return (STATE.data.expenses||[]).filter(inCurrentYear); }
function monthIncome(){ return (STATE.data.income||[]).filter(inCurrentMonth); }
function yearSavings(){ return (STATE.data.savings||[]).filter(inCurrentYear); }

function sum(arr, key){ return arr.reduce((s,r)=> s + (Number(r[key])||0), 0); }
function fmt(n){ const v = Number(n); return '₪' + (isNaN(v) ? 0 : Math.round(v)).toLocaleString('he-IL'); }

function forecastByMonth(person, type){
  const out = Array(12).fill(null);
  (STATE.data.forecast||[]).filter(r=>r.Person===person && r.Type===type).forEach(r=>{
    out[r.Month-1] = r.Amount;
  });
  return out;
}

function personIcon(person){ return (person||'?').trim().charAt(0); }
function personClass(person){ return person===STATE.person1 ? 'p1' : 'p2'; }

function chartColors(){
  const root = document.documentElement;
  if(root.classList.contains('light')) return { text:'#1c2333', muted:'#6b7590', grid:'#dde3f0', panel:'#ffffff' };
  if(root.classList.contains('pink')) return { text:'#5a2a3f', muted:'#a56b83', grid:'#f6cede', panel:'#fff5f9' };
  return { text:'#ececec', muted:'#9a9a9e', grid:'#38383a', panel:'#1c1c1e' };
}

async function deleteRecord(type, id){
  if(!confirm('למחוק את הרשומה הזו?')) return;
  const res = await postData({type, id});
  if(res.error){ showToast(res.error, 'error'); return; }
  await refreshData();
  render();
}

/* ---------- ערכות נושא: כהה / בהיר / ורוד ---------- */

/* ---------- רקעי אתר ---------- */
const BG_IMAGES = {
  grid: { name:"רשת דיגיטלית", emoji:"🟦", data:"https://images.unsplash.com/photo-1558494949-ef010cbdcc31?fm=jpg&q=80&w=2000&auto=format&fit=crop" },
  plexus: { name:"פלקסוס כחול-ירוק", emoji:"🔷", data:"https://images.unsplash.com/photo-1451187580459-43490279c0fa?fm=jpg&q=80&w=2000&auto=format&fit=crop" },
  winter: { name:"נוף חורפי", emoji:"❄️", data:"https://images.unsplash.com/photo-1418985991508-e47386d96a71?fm=jpg&q=80&w=2000&auto=format&fit=crop" },
  neon: { name:"ניאון גיאומטרי", emoji:"🟣", data:"https://images.unsplash.com/photo-1550745165-9bc0b252726f?fm=jpg&q=80&w=2000&auto=format&fit=crop" }
};
const DEFAULT_BG_URL = 'url("https://images.unsplash.com/photo-1666126452579-f032d653c7f1?fm=jpg&q=80&w=2000&auto=format&fit=crop")';

function currentBg(){
  return localStorage.getItem('budget_bg') || 'default';
}

function setBackground(id){
  const root = document.documentElement;
  if(id === 'default' || !BG_IMAGES[id]){
    root.style.setProperty('--bg-image', DEFAULT_BG_URL);
    localStorage.setItem('budget_bg', 'default');
  } else {
    root.style.setProperty('--bg-image', 'url("' + BG_IMAGES[id].data + '")');
    localStorage.setItem('budget_bg', id);
  }
  if(STATE.currentTab === 'settings') render();
}

(function initBackground(){
  const saved = localStorage.getItem('budget_bg');
  if(saved && saved !== 'default' && BG_IMAGES[saved]){
    document.documentElement.style.setProperty('--bg-image', 'url("' + BG_IMAGES[saved].data + '")');
  }
})();

const THEMES = ['dark','light','pink'];
const THEME_LABELS = { dark:'🌙 כהה', light:'☀️ בהיר', pink:'🌸 ורוד' };

function currentTheme(){
  const root = document.documentElement;
  if(root.classList.contains('light')) return 'light';
  if(root.classList.contains('pink')) return 'pink';
  return 'dark';
}

function setTheme(theme){
  const root = document.documentElement;
  root.classList.remove('light','pink');
  if(theme==='light') root.classList.add('light');
  else if(theme==='pink') root.classList.add('pink');
  localStorage.setItem('budget_theme', theme);
  updateThemeBtn();
  render(); // כדי לרענן צבעי גרפים
}

// הכפתור המהיר בסרגל - מחליף בין שלוש הערכות במעגל
function toggleTheme(){
  const idx = THEMES.indexOf(currentTheme());
  const next = THEMES[(idx + 1) % THEMES.length];
  setTheme(next);
}

function updateThemeBtn(){
  const btn = document.getElementById('themeToggleBtn');
  if(btn){
    const idx = THEMES.indexOf(currentTheme());
    const next = THEMES[(idx + 1) % THEMES.length];
    btn.textContent = THEME_LABELS[next];
  }
}
(function initTheme(){
  const saved = localStorage.getItem('budget_theme');
  if(saved === 'light') document.documentElement.classList.add('light');
  else if(saved === 'pink') document.documentElement.classList.add('pink');
})();

/* ---------- Render dispatcher ---------- */
let chartInstances = {};
function destroyCharts(){ Object.values(chartInstances).forEach(c=>c && c.destroy()); chartInstances={}; }

function render(){
  destroyCharts();
  const c = document.getElementById('content');
  // אנימציית מעבר חלק בין טאבים
  c.classList.remove('tabFade');
  void c.offsetWidth; // מאלץ reflow כדי שהאנימציה תרוץ מחדש
  c.classList.add('tabFade');
  if(STATE.currentTab==='dashboard') c.innerHTML = renderDashboard();
  if(STATE.currentTab==='expenses') c.innerHTML = renderExpenses();
  if(STATE.currentTab==='income') c.innerHTML = renderIncome();
  if(STATE.currentTab==='savings') c.innerHTML = renderSavings();
  if(STATE.currentTab==='ai') c.innerHTML = renderAI();
  if(STATE.currentTab==='settings') c.innerHTML = renderSettings();
  if(STATE.currentTab==='forecast') c.innerHTML = renderForecast();
  if(STATE.currentTab==='trips') c.innerHTML = renderTrips();
  if(STATE.currentTab==='investments') c.innerHTML = renderInvestments();

  setTimeout(()=>{
    const safe = (fn)=>{ try{ fn(); }catch(e){ console.error('chart build error:', e); } };

    if(STATE.currentTab==='income'){ safe(buildIncomeChart); safe(buildForecastCharts); safe(buildIncomeExpenseCharts); }
    if(STATE.currentTab==='savings'){ safe(buildSavingsChart); safe(animateVault); safe(animateGoalVaults); }
    if(STATE.currentTab==='forecast'){ safe(buildBudgetChart); }
    if(STATE.currentTab==='investments'){ safe(buildInvestChart); }
    safe(animateCountUp); // ספירת מספרים בכל הטאבים
  }, 50);
}

/* ---------- דשבורד ---------- */
function timeGreeting(){
  const h = new Date().getHours();
  if(h >= 5 && h < 12) return 'בוקר טוב';
  if(h >= 12 && h < 17) return 'צהריים טובים';
  if(h >= 17 && h < 21) return 'ערב טוב';
  return 'לילה טוב';
}
function greetingEmoji(){
  const h = new Date().getHours();
  if(h >= 5 && h < 12) return '☀️';
  if(h >= 12 && h < 17) return '🌤️';
  if(h >= 17 && h < 21) return '🌆';
  return '🌙';
}

/* ---------- תובנות חכמות בדשבורד ---------- */
function renderInsights(){
  const insights = [];
  const people = [STATE.person2, STATE.person1];

  // 1. בדיקת חריגה מתקציב לכל אדם וקטגוריה (בחודש הנוכחי)
  people.forEach(person=>{
    const spent = monthExpensesByCategory(person);
    const cats = (STATE.data.settings.Categories||'').split(',').filter(Boolean);
    cats.forEach(cat=>{
      const budget = budgetFor(person, cat);
      const used = spent[cat] || 0;
      if(budget > 0 && used > budget){
        const over = used - budget;
        insights.push({icon:'⚠️', type:'warn', text:`${person} חרג/ה מהתקציב ל"${cat}" ב-${fmt(over)} (${fmt(used)} מתוך ${fmt(budget)})`});
      } else if(budget > 0 && used >= budget*0.9 && used <= budget){
        insights.push({icon:'🟡', type:'near', text:`${person} קרוב/ה לתקרת התקציב ל"${cat}" (${fmt(used)} מתוך ${fmt(budget)})`});
      }
    });
  });

  // 2. השוואת הוצאות החודש לחודש הקודם
  const thisMonthExp = sum(monthExpenses(),'Amount');
  const prevM = STATE.currentMonth===0 ? 11 : STATE.currentMonth-1;
  const prevY = STATE.currentMonth===0 ? STATE.currentYear-1 : STATE.currentYear;
  const prevExp = sum((STATE.data.expenses||[]).filter(r=>{
    const d = rowDate(r); return d.getMonth()===prevM && d.getFullYear()===prevY;
  }),'Amount');
  if(prevExp > 0 && thisMonthExp > prevExp*1.2){
    const morePct = Math.round((thisMonthExp/prevExp-1)*100);
    insights.push({icon:'📈', type:'warn', text:`הוצאתם ${morePct}% יותר מ${MONTHS[prevM]} (${fmt(thisMonthExp)} מול ${fmt(prevExp)})`});
  } else if(prevExp > 0 && thisMonthExp < prevExp*0.8){
    const lessPct = Math.round((1-thisMonthExp/prevExp)*100);
    insights.push({icon:'🎉', type:'good', text:`כל הכבוד! הוצאתם ${lessPct}% פחות מ${MONTHS[prevM]}`});
  }

  // 3. אם אין תובנות - הודעה חיובית
  if(!insights.length){
    return `<div class="panel insightsPanel">
      <div class="insightRow good"><span>✅</span><span>הכל נראה טוב החודש! אין חריגות מהתקציב.</span></div>
    </div>`;
  }

  // מציגים עד 4 תובנות
  const shown = insights.slice(0,4).map(i=>
    `<div class="insightRow ${i.type}"><span>${i.icon}</span><span>${i.text}</span></div>`
  ).join('');
  return `<div class="panel insightsPanel"><h3>💡 תובנות</h3>${shown}</div>`;
}

function buildOnePersonDashChart(canvasId, person){
  const ctx = document.getElementById(canvasId);

  const expByMonth = Array(12).fill(0);

  (STATE.data.expenses||[]).filter(r=>rowDate(r).getFullYear()===STATE.currentYear && r.Person===person).forEach(r=>{
    expByMonth[rowDate(r).getMonth()] += Number(r.Amount)||0;
  });
  (STATE.data.income||[]).filter(r=>rowDate(r).getFullYear()===STATE.currentYear && r.Person===person).forEach(r=>{
    incByMonth[rowDate(r).getMonth()] += Number(r.Net)||0;

  chartInstances[canvasId] = new Chart(ctx, {

      {label:'הוצאות', data:expByMonth, backgroundColor:'#ef5a5a'}
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{legend:{labels:{color:chartColors().text}},
        tooltip:{ callbacks:{ label:(ctx)=> ctx.dataset.label+': '+fmt(ctx.parsed.y) } }},
      scales:{ x:{ticks:{color:chartColors().muted}, grid:{color:chartColors().grid}},

const PIE_PALETTE = ['#1fbf9f','#ec5a8f','#4f8ff7','#f5a623','#a463f2','#f26d6d','#4fd1c5','#f2a154',
  '#7ec8e3','#c99cf2','#f2789c','#6fcf97','#f2c94c','#56ccf2','#bb6bd9','#eb5757','#219653','#f2994a',
  '#9b51e0','#2f80ed','#27ae60','#e2b93b','#828282','#f08080'];

function buildOnePie(canvasId, person){
  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  const wrap = ctx.closest('.chartWrap');
  const rows = monthExpenses().filter(r=>r.Person===person);
  const byCat = {};
  rows.forEach(r=>{ byCat[r.Category] = (byCat[r.Category]||0) + (Number(r.Amount)||0); });
  const labels = Object.keys(byCat);
  const values = Object.values(byCat);
  if(!labels.length){
    if(wrap) wrap.innerHTML = `<div class="empty"><div class="big">אין הוצאות ל${person} בחודש זה</div></div><canvas id="${canvasId}"></canvas>`;
    return;
  }
  const total = values.reduce((a,b)=>a+b,0);
  chartInstances[canvasId] = new Chart(ctx, {
    type:'doughnut',
    data:{ labels, datasets:[{ data:values, backgroundColor:labels.map((_,i)=>PIE_PALETTE[i%PIE_PALETTE.length]), borderWidth:2, borderColor:chartColors().panel || 'transparent' }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{ position:'bottom', labels:{ color:chartColors().text, boxWidth:12, font:{size:11} } },
        tooltip:{
          enabled:true,
          backgroundColor:'rgba(0,0,0,.85)',
          titleColor:'#fff', bodyColor:'#fff',
          padding:12, cornerRadius:8, titleFont:{size:14, weight:'bold'}, bodyFont:{size:13},
          callbacks:{
            title:(items)=> items[0].label,
            label:(item)=>{
              const val = item.parsed;
              const p = total ? (Math.round(val/total*1000)/10) : 0;
              return fmt(val) + ' · ' + p + '%';
            }
          }
        },
        datalabels:{
          display:(ctx)=>{
            // מציגים אחוז רק על פרוסות מספיק גדולות (מעל 4%) כדי שלא יהיה צפוף
            const v = ctx.dataset.data[ctx.dataIndex];
            return total && (v/total) > 0.04;
          },
          color:'#fff', font:{weight:'bold', size:12},
          anchor:'center', align:'center',
          formatter:(value)=> total ? (Math.round(value/total*1000)/10) + '%' : ''
        }
      }
    }
  });
}

/* ---------- אנימציית כספת עם גלים ---------- */
let vaultAnimId = null;
function animateVault(){
  const svg = document.querySelector('.vaultSvg');
  if(!svg) return;
  if(vaultAnimId) cancelAnimationFrame(vaultAnimId);

  const total = sum(yearSavings(),'Amount');
  const targetPct = STATE.goal ? Math.min(100,(total/STATE.goal)*100) : 0;

  const wave1 = svg.querySelector('#wave1');
  const wave2 = svg.querySelector('#wave2');
  const fill = svg.querySelector('#waveFill');
  const pctText = svg.querySelector('#vaultPct');

  // גבולות הכספת המרובעת: פנים בין y=30 (מלא) ל-y=210 (ריק), רוחב x=30..210
  const topY = 30, bottomY = 210, range = bottomY - topY;
  const xLeft = 30, xRight = 210;

  let currentPct = 0; // מתחילים מ-0 (מלמטה) ועולים
  const startTime = performance.now();
  const RISE_MS = 1400; // משך העלייה

  function buildWavePath(baseY, amplitude, phase){
    // גל סינוסי לרוחב הכספת (x=30..210)
    let d = `M ${xLeft} ${baseY}`;
    for(let x=xLeft; x<=xRight; x+=10){
      const y = baseY + Math.sin(((x-xLeft)/(xRight-xLeft))*Math.PI*2 + phase) * amplitude;
      d += ` L ${x} ${y}`;
    }
    d += ` L ${xRight} ${bottomY+30} L ${xLeft} ${bottomY+30} Z`;
    return d;
  }

  function frame(now){
    const elapsed = now - startTime;
    const riseProgress = Math.min(1, elapsed / RISE_MS);
    // האטה יפה בסוף (ease-out)
    const eased = 1 - Math.pow(1 - riseProgress, 3);
    currentPct = targetPct * eased;

    const waterY = bottomY - (currentPct/100) * range;
    if(fill){ fill.setAttribute('y', waterY); fill.setAttribute('height', Math.max(0, bottomY - waterY)); }

    const phase = now / 400; // מהירות הגלים
    if(wave1) wave1.setAttribute('d', buildWavePath(waterY, 4, phase));
    if(wave2) wave2.setAttribute('d', buildWavePath(waterY, 3, phase + Math.PI));
    if(pctText) pctText.textContent = Math.round(currentPct) + '%';

    vaultAnimId = requestAnimationFrame(frame);
  }
  vaultAnimId = requestAnimationFrame(frame);
}

const goalAnimIds = {};
function animateOneGoalVault(uid, targetPct){
  const svg = document.querySelector(`.goalVaultSvg[data-uid="${uid}"]`);
  if(!svg) return;
  if(goalAnimIds[uid]) cancelAnimationFrame(goalAnimIds[uid]);

  const wave1 = svg.querySelector(`#w1_${uid}`);
  const wave2 = svg.querySelector(`#w2_${uid}`);
  const fill = svg.querySelector(`#fill_${uid}`);
  const pctText = svg.querySelector(`#pct_${uid}`);

  const topY = 30, bottomY = 210, range = bottomY - topY;
  const xLeft = 30, xRight = 210;
  const startTime = performance.now();
  const RISE_MS = 1400;
  let confettiFired = false;

  function buildWavePath(baseY, amplitude, phase){
    let d = `M ${xLeft} ${baseY}`;
    for(let x=xLeft; x<=xRight; x+=10){
      const y = baseY + Math.sin(((x-xLeft)/(xRight-xLeft))*Math.PI*2 + phase) * amplitude;
      d += ` L ${x} ${y}`;
    }
    d += ` L ${xRight} ${bottomY+30} L ${xLeft} ${bottomY+30} Z`;
    return d;
  }

  function frame(now){
    const elapsed = now - startTime;
    const riseProgress = Math.min(1, elapsed / RISE_MS);
    const eased = 1 - Math.pow(1 - riseProgress, 3);
    const currentPct = targetPct * eased;

    const waterY = bottomY - (currentPct/100) * range;
    if(fill){ fill.setAttribute('y', waterY); fill.setAttribute('height', Math.max(0, bottomY - waterY)); }
    const phase = now / 400;
    if(wave1) wave1.setAttribute('d', buildWavePath(waterY, 4, phase));
    if(wave2) wave2.setAttribute('d', buildWavePath(waterY, 3, phase + Math.PI));
    if(pctText) pctText.textContent = Math.round(currentPct) + '%';

    // קונפטי כשמגיעים ל-100%
    if(!confettiFired && targetPct >= 100 && riseProgress >= 1){
      confettiFired = true;
      fireConfetti(svg);
    }
    goalAnimIds[uid] = requestAnimationFrame(frame);
  }
  goalAnimIds[uid] = requestAnimationFrame(frame);
}

// קונפטי חגיגי מעל אלמנט
function fireConfetti(anchorEl){
  const colors = ['#1fbf9f','#4f8ff7','#ec5a8f','#f5a623','#a463f2','#f26d6d','#ffd700'];
  const rect = anchorEl.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  for(let i=0;i<40;i++){
    const p = document.createElement('div');
    p.style.position = 'fixed';
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.width = '9px';
    p.style.height = '9px';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.borderRadius = Math.random()>0.5 ? '50%' : '2px';
    p.style.zIndex = '99999';
    p.style.pointerEvents = 'none';
    document.body.appendChild(p);
    const angle = Math.random()*Math.PI*2;
    const dist = 80 + Math.random()*140;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist - 60;
    p.animate([
      {transform:'translate(0,0) rotate(0deg)', opacity:1},
      {transform:`translate(${dx}px,${dy+200}px) rotate(${Math.random()*720}deg)`, opacity:0}
    ],{duration:1400+Math.random()*800, easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish = ()=>p.remove();
  }
}

function buildSavingsChart(){
  const ctx = document.getElementById('savChart');
  if(!ctx) return;
  const ySav = yearSavings().sort((a,b)=>rowDate(a)-rowDate(b));
  const byMonth = Array(12).fill(0);
  const byMonthP1 = Array(12).fill(0);
  const byMonthP2 = Array(12).fill(0);
  ySav.forEach(r=>{
    const m = rowDate(r).getMonth();
    byMonth[m] += Number(r.Amount)||0;
    if(r.Person===STATE.person1) byMonthP1[m] += Number(r.Amount)||0;
    else if(r.Person===STATE.person2) byMonthP2[m] += Number(r.Amount)||0;
  });
  const cumulative = toCumulative(byMonth);
  const cumP1 = toCumulative(byMonthP1);
  const cumP2 = toCumulative(byMonthP2);
  const goalLine = MONTHS.map(()=> STATE.goal);
  const cc = chartColors();

  chartInstances.sav = new Chart(ctx, {
    type:'line',
    data:{ labels:MONTHS, datasets:[
      {label:'חיסכון מצטבר', data:cumulative, borderColor:'#1fbf9f', backgroundColor:'rgba(31,191,159,.15)', fill:true, tension:.3},
      {label:'יעד', data:goalLine, borderColor:'#f5a623', borderDash:[6,6], pointRadius:0}
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{legend:{labels:{color:cc.text}}},
      scales:{ x:{ticks:{color:cc.muted}, grid:{color:cc.grid}}, y:{ticks:{color:cc.muted}, grid:{color:cc.grid}} } }
  });

  const ctxP2 = document.getElementById('savChartP2');
  if(ctxP2){
    chartInstances.savP2 = new Chart(ctxP2, {
      type:'line',
      data:{ labels:MONTHS, datasets:[
        {label:'סכום שנחסך עד כה', data:cumP2, borderColor:'#4f8ff7', backgroundColor:'rgba(79,143,247,.15)', fill:true, tension:.3}
      ]},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{legend:{labels:{color:cc.text}}},
        scales:{ x:{ticks:{color:cc.muted}, grid:{color:cc.grid}}, y:{ticks:{color:cc.muted}, grid:{color:cc.grid}} } }
    });
  }

  const ctxP1 = document.getElementById('savChartP1');
  if(ctxP1){
    chartInstances.savP1 = new Chart(ctxP1, {
      type:'line',
      data:{ labels:MONTHS, datasets:[
        {label:'סכום שנחסך עד כה', data:cumP1, borderColor:'#ec5a8f', backgroundColor:'rgba(236,90,143,.15)', fill:true, tension:.3}
      ]},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{legend:{labels:{color:cc.text}}},
        scales:{ x:{ticks:{color:cc.muted}, grid:{color:cc.grid}}, y:{ticks:{color:cc.muted}, grid:{color:cc.grid}} } }
    });
  }

  const ctxM = document.getElementById('savChartMonthly');
  if(ctxM){
    chartInstances.savMonthly = new Chart(ctxM, {
      type:'bar',
      data:{ labels:MONTHS, datasets:[
        {label:STATE.person2, data:byMonthP2, backgroundColor:'#4f8ff7'},
        {label:STATE.person1, data:byMonthP1, backgroundColor:'#ec5a8f'}
      ]},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{legend:{labels:{color:cc.text}}},
        scales:{ x:{ticks:{color:cc.muted}, grid:{color:cc.grid}}, y:{ticks:{color:cc.muted}, grid:{color:cc.grid}} } }
    });
  }
}

function toCumulative(arr){
  const out = []; let run = 0;
  arr.forEach(v=>{ run += v; out.push(run); });
  return out;
}

const AI_SUGGESTIONS = [

function renderAI(){
  const msgs = STATE.aiMessages.map((m,i) => {

    }

  }).join('');
  return `

      ${msgs || `<div class="chatEmpty">שאלו כל שאלה על ההוצאות, ההכנסות והחיסכון שלכם - העוזר עונה לפי הנתונים האמיתיים בגיליון.</div>`}
    </div>
    ${STATE.aiMessages.length===0 ? `<div class="chatSuggestions">${AI_SUGGESTIONS.map(s=>`<button onclick="sendAIQuestion('${s.replace(/'/g,"\\'")}')">${s}</button>`).join('')}</div>` : ''}
    <div class="chatInputRow">
      <input type="text" id="chatInput" placeholder="שאלו משהו..." onkeydown="if(event.key==='Enter')sendAIQuestionFromInput()">

    </div>
  </div>`;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function sendAIQuestionFromInput(){
  const input = document.getElementById('chatInput');
  const q = input.value.trim();
  if(!q) return;
  input.value = '';
  sendAIQuestion(q);
}

async function sendAIQuestion(question){
  // בונים היסטוריה מההודעות הקודמות (ללא ה-loading) לזיכרון שיחה
  const history = STATE.aiMessages
    .filter(m => m.role==='user' || m.role==='ai')
    .map(m => ({ role: m.role==='user' ? 'user' : 'ai', text: m.text }));

  STATE.aiMessages.push({role:'user', text:question});
  STATE.aiMessages.push({role:'loading', text:'חושב...'});
  render();
  scrollChatToBottom();

  const res = await postData({type:'askAI', question, history});
  STATE.aiMessages.pop(); // מסיר את "חושב..."
  if(res.error){
    STATE.aiMessages.push({role:'ai', text:'שגיאה: ' + res.error});
  } else {
    STATE.aiMessages.push({role:'ai', text: res.answer || 'לא התקבלה תשובה.'});
  }
  render();
  scrollChatToBottom();
}

function scrollChatToBottom(){
  requestAnimationFrame(()=>{
    const box = document.getElementById('chatBox');
    if(box) box.scrollTop = box.scrollHeight;
  });
}

// פאנל תחזית תשואה לפי חברה נבחרת
function renderReturnProjection(byCompany, companies){
  // חברה נבחרת (ברירת מחדל: הראשונה)
  if(!STATE.projCompany || !companies.includes(STATE.projCompany)){
    STATE.projCompany = companies[0];
  }
  const company = STATE.projCompany;
  const amount = byCompany[company] || 0;
  // האחוז השמור לחברה הזו (מפתח ייחודי ב-Settings), ברירת מחדל 7
  const rateKey = 'Rate_' + company;
  const rate = Number(STATE.data.settings[rateKey] != null ? STATE.data.settings[rateKey] : 7);

  const options = companies.map(c=>
    `<option value="${c}" ${c===company?'selected':''}>${c}</option>`
  ).join('');

  const projCards = [1,3,5,10].map(yrs=>{
    const projected = amount * Math.pow(1 + rate/100, yrs);
    const gain = projected - amount;
    return `<div class="card">
      <div class="lbl">בעוד ${yrs} ${yrs===1?'שנה':'שנים'}</div>
      <div class="val green">${fmt(projected)}</div>
      <div style="color:var(--muted);font-size:12px;margin-top:4px;">רווח: ${fmt(gain)}</div>
    </div>`;
  }).join('');

  return `<div class="panel">

function buildInvestChart(){

/* ---------- נכסים ---------- */
const ASSET_TYPES = ['חיסכון','השקעות','נדל"ן','רכב','הלוואה','אחר'];

function renderAssets(){
  const assets = STATE.data.assets||[];
  // נכסים חיוביים פחות הלוואות = שווי נטו
  let totalAssets = 0, totalLoans = 0;
  assets.forEach(a=>{
    if(a.Type==='הלוואה') totalLoans += Number(a.Amount)||0;
    else totalAssets += Number(a.Amount)||0;
  });
  const net = totalAssets - totalLoans;

  const list = assets.length ? assets.slice().reverse().map(a=>{
    const isLoan = a.Type==='הלוואה';
    return `<div class="listRow">
      <div><b>${a.Name}</b> <span style="color:var(--muted);font-size:12px;">· ${a.Type}</span></div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="${isLoan?'red':'green'}">${isLoan?'-':''}${fmt(a.Amount)}</span>
        <button class="delBtn" onclick="deleteRecord('deleteAsset','${a.Id}')">🗑</button>
      </div>
    </div>`;
  }).join('') : '<div style="color:var(--muted);padding:20px;text-align:center;">אין נכסים עדיין</div>';

  return `
  <div class="topbar">
    <h2>נכסים 💼</h2>
    <button class="addBtn" onclick="openAssetModal()">הוסף נכס +</button>
  </div>
  <div class="cards">
    <div class="card"><div class="lbl">סה"כ נכסים</div><div class="val green">${fmt(totalAssets)}</div></div>
    <div class="card"><div class="lbl">סה"כ הלוואות</div><div class="val red">${fmt(totalLoans)}</div></div>
    <div class="card"><div class="lbl">שווי נטו</div><div class="val ${net>=0?'green':'red'}">${fmt(net)}</div></div>
  </div>
  <div class="panel">
    <h3>כל הנכסים וההלוואות</h3>
    <div class="list">${list}</div>
  </div>`;
}

function openAssetModal(){
  const opts = ASSET_TYPES.map(t=>`<option value="${t}">${t}</option>`).join('');
  showModal(`
    <div class="mhead"><h3>נכס חדש</h3><button class="close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>סוג</label><select id="assetType">${opts}</select></div>
    <div class="field"><label>שם / תיאור</label><input type="text" id="assetName" placeholder="למשל: הלוואת רכב, דירה"></div>
    <div class="field"><label>סכום</label><input type="number" id="assetAmount" placeholder="0"></div>
    <button class="saveBtn" onclick="saveAsset()">שמור</button>
  `);
}

async function saveAsset(){
  const assetType = document.getElementById('assetType').value;
  const name = document.getElementById('assetName').value.trim();
  const amount = Number(document.getElementById('assetAmount').value);
  if(!name || !amount){ showToast('צריך שם וסכום', 'error'); return; }
  const res = await postData({type:'asset', assetType, name, amount});
  if(res.error){ showToast(res.error, 'error'); return; }
  closeModal();
  await refreshData();
  render();
}

/* ---------- טיולים ---------- */
const TRIP_CATS_ISRAEL = ['אוכל','אטרקציות'];
const TRIP_CATS_ABROAD = ['כרטיסי טיסה הלוך וחזור','ביטוח','אוכל','בגדים','תרופות','תחבורה ציבורית','טיסות פנימיות','אחר'];

function tripsGrouped(){
  // מקבץ את שורות הטיולים לפי מזהה_טיול
  const map = {};
  (STATE.data.trips||[]).forEach(r=>{
    if(!map[r.TripId]){
      map[r.TripId] = { id:r.TripId, name:r.Name, location:r.Location, destination:r.Destination, items:[] };
    }
    map[r.TripId].items.push({category:r.Category, amount:r.Amount});
  });
  return Object.values(map);
}

function renderTrips(){
  const trips = tripsGrouped();
  const list = trips.length ? trips.map(t=>{
    const total = t.items.reduce((s,i)=>s+(Number(i.amount)||0),0);
    const where = t.location==='חול' ? `חו"ל - ${t.destination}` : 'בארץ';
    const rows = t.items.filter(i=>Number(i.amount)>0).map(i=>
      `<div class="tripItem"><span>${i.category}</span><span>${fmt(i.amount)}</span></div>`
    ).join('');
    return `<div class="tripCard">
      <div class="tripHead">
        <div>
          <div class="tripName">✈️ ${t.name}</div>
          <div class="tripWhere">${where}</div>
        </div>
        <button class="delBtn" onclick="deleteTrip('${t.id}')">🗑</button>
      </div>
      <div class="tripItems">${rows || '<span style="color:var(--muted);">אין הוצאות</span>'}</div>
      <div class="tripTotal">סה"כ: ${fmt(total)}</div>
    </div>`;
  }).join('') : '<div style="color:var(--muted);text-align:center;padding:30px;">אין טיולים עדיין. הוסיפו טיול חדש עם הכפתור למעלה.</div>';

  return `
  <div class="topbar">
    <h2>טיולים ✈️</h2>
    <button class="addBtn" onclick="openTripModal()">הוסף טיול +</button>
  </div>
  <div class="tripGrid">${list}</div>`;
}

function openTripModal(){
  showModal(`
    <div class="mhead"><h3>טיול חדש</h3><button class="close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>שם הטיול</label><input type="text" id="tripName" placeholder="למשל: חופשה ביוון"></div>
    <div class="field"><label>מיקום</label>
      <select id="tripLocation" onchange="onTripLocationChange()">
        <option value="ארץ">בארץ</option>
        <option value="חול">בחו"ל</option>
      </select>
    </div>
    <div class="field" id="destField" style="display:none;"><label>יעד (לאן?)</label><input type="text" id="tripDest" placeholder="למשל: יוון, תאילנד"></div>
    <div class="field" id="currField" style="display:none;"><label>מטבע</label>
      <select id="tripCurrency" onchange="onCurrencyChange()">
        <option value="ILS">₪ שקל</option>
        <option value="USD">$ דולר</option>
        <option value="EUR">€ יורו</option>
        <option value="GBP">£ פאונד</option>
        <option value="JPY">¥ ין יפני</option>
        <option value="THB">฿ באט תאילנדי</option>
        <option value="CHF">₣ פרנק שוויצרי</option>
        <option value="AUD">$ דולר אוסטרלי</option>
      </select>
      <div id="rateInfo" style="color:var(--muted);font-size:12px;margin-top:6px;"></div>
    </div>
    <div id="tripCatsArea"></div>
    <button class="saveBtn" onclick="saveTrip()">שמור טיול</button>
  `);
  renderTripCats();
}

let currentRate = 1; // שער המרה נוכחי למטבע הנבחר (כמה שקל = 1 יחידת מטבע)

function onTripLocationChange(){
  const loc = document.getElementById('tripLocation').value;
  const abroad = loc==='חול';
  document.getElementById('destField').style.display = abroad ? 'block' : 'none';
  document.getElementById('currField').style.display = abroad ? 'block' : 'none';
  if(!abroad){ document.getElementById('tripCurrency').value = 'ILS'; currentRate = 1; }
  else onCurrencyChange();
  renderTripCats();
}

async function onCurrencyChange(){
  const cur = document.getElementById('tripCurrency').value;
  const info = document.getElementById('rateInfo');
  if(cur === 'ILS'){ currentRate = 1; if(info) info.textContent = ''; return; }
  if(info) info.textContent = 'טוען שער המרה...';
  try{
    // API חינמי לשערי מטבע
    const res = await fetch(`https://api.exchangerate-api.com/v4/latest/${cur}`);
    const data = await res.json();
    currentRate = data.rates.ILS || 1;
    if(info) info.textContent = `שער נוכחי: 1 ${cur} = ${currentRate.toFixed(2)} ₪ (הסכומים יומרו לשקלים)`;
  }catch(e){
    currentRate = 1;
    if(info) info.textContent = '⚠️ לא הצלחנו לטעון שער - הסכומים יישמרו כפי שהם';
  }
}

function renderTripCats(){
  const loc = document.getElementById('tripLocation').value;
  const cats = loc==='חול' ? TRIP_CATS_ABROAD : TRIP_CATS_ISRAEL;
  const area = document.getElementById('tripCatsArea');
  area.innerHTML = '<label style="display:block;margin:10px 0 6px;color:var(--muted);font-size:13px;">הוצאות לפי קטגוריה:</label>' +
    '<div class="tripCatsScroll">' +
    cats.map(c=>`<div class="field" style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
      <span style="flex:1;font-size:14px;">${c}</span>
      <input type="number" min="0" class="tripCatInput" data-cat="${c.replace(/"/g,'&quot;')}" placeholder="0" style="width:110px;">
    </div>`).join('') +
    '</div>';
}

async function saveTrip(){
  const name = document.getElementById('tripName').value.trim();
  const location = document.getElementById('tripLocation').value;
  const destination = location==='חול' ? document.getElementById('tripDest').value.trim() : '';
  if(!name){ showToast('צריך שם לטיול', 'error'); return; }

  const rate = currentRate || 1; // ממירים לשקלים
  const items = [];
  document.querySelectorAll('.tripCatInput').forEach(inp=>{
    const amount = Number(inp.value);
    if(amount > 0) items.push({category: inp.dataset.cat, amount: Math.round(amount * rate)});
  });

  const trip = {
    id: 'trip_' + Date.now(),
    name, location, destination, items
  };
  const res = await postData({type:'saveTrip', trip});
  if(res.error){ showToast('שגיאה: ' + res.error, 'error'); return; }
  closeModal();
  await refreshData();
  render();
}

async function deleteTrip(tripId){
  if(!confirm('למחוק את הטיול הזה?')) return;
  const res = await postData({type:'deleteTrip', tripId});
  if(res.error){ showToast(res.error, 'error'); return; }
  await refreshData();
  render();
}

/* ---------- תחזית ותקציבים ---------- */
function budgetFor(person, category){
  const b = (STATE.data.budgets||[]).find(x=>x.Person===person && x.Category===category);
  return b ? b.Amount : 0;
}

function yearExpensesByCategory(person){
  const out = {};
  (STATE.data.expenses||[]).filter(r=>rowDate(r).getFullYear()===STATE.currentYear && r.Person===person).forEach(r=>{
    out[r.Category] = (out[r.Category]||0) + (Number(r.Amount)||0);
  });
  return out;
}

// הוצאות של חודש ספציפי (החודש שנבחר בראש האתר) לפי קטגוריה
function monthExpensesByCategory(person){
  const out = {};
  (STATE.data.expenses||[]).filter(r=>{
    const d = rowDate(r);
    return d.getFullYear()===STATE.currentYear && d.getMonth()===STATE.currentMonth && r.Person===person;
  }).forEach(r=>{
    out[r.Category] = (out[r.Category]||0) + (Number(r.Amount)||0);
  });
  return out;
}

function renderForecast(){
  if(!STATE.forecastPerson) STATE.forecastPerson = STATE.person2;
  const person = STATE.forecastPerson;
  const cats = (STATE.data.settings.Categories||'').split(',').filter(Boolean);
  const spent = monthExpensesByCategory(person);

  const rows = cats.map(cat=>{
    const monthly = budgetFor(person, cat);
    const used = spent[cat] || 0;
    const remaining = monthly - used;
    let statusColor = 'var(--muted)';
    if(monthly > 0){
      statusColor = remaining < 0 ? 'var(--red)' : 'var(--accent)';
    }
    return `<tr>
      <td>${cat}</td>
      <td><input type="number" min="0" class="budgetInput" data-cat="${cat.replace(/"/g,'&quot;')}" value="${monthly||''}" placeholder="0" style="width:80px;"></td>
      <td>${used ? fmt(used) : '—'}</td>
      <td style="color:${statusColor};font-weight:600;">${monthly>0 ? fmt(remaining) : '—'}</td>
    </tr>`;
  }).join('');

  return `
  <div class="topbar">
    <h2>תחזית ותקציבים 📊</h2>
    ${monthNavHTML()}
  </div>
  <div class="panel">
    <div class="personChips">
      <button class="chip ${person===STATE.person2?'active':''}" onclick="setForecastPerson('${STATE.person2}')">${STATE.person2}</button>
      <button class="chip ${person===STATE.person1?'active':''}" onclick="setForecastPerson('${STATE.person1}')">${STATE.person1}</button>
    </div>
    <p style="color:var(--muted);font-size:14px;">הגדירו תחזית/תקציב חודשי לכל קטגוריה. הטבלה מציגה כמה הוצאתם ב${MONTHS[STATE.currentMonth]} וכמה נשאר.</p>
    <div class="budgetTableWrap">
    <table class="budgetTable">
      <thead><tr><th>קטגוריה</th><th>תחזית (₪)</th><th>הוצאתם</th><th>נשאר</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
    <button class="addBtn" onclick="saveBudgets()" style="margin-top:14px;">💾 שמור תחזית</button>
  </div>
  <div class="panel">
    <h3>תקציב חודשי מול הוצאות ב${MONTHS[STATE.currentMonth]} - ${person}</h3>
    <div class="chartWrap"><canvas id="budgetChart"></canvas></div>
  </div>`;
}

function setForecastPerson(person){
  STATE.forecastPerson = person;
  render();
}

async function saveBudgets(){
  const person = STATE.forecastPerson;
  const inputs = document.querySelectorAll('.budgetInput');
  const budgets = [];
  inputs.forEach(inp=>{
    const amount = Number(inp.value);
    if(amount > 0) budgets.push({category: inp.dataset.cat, amount});
  });
  const res = await postData({type:'saveBudgets', person, budgets});
  if(res.error){ showToast('שגיאה: ' + res.error, 'error'); return; }
  showToast('התקציבים נשמרו!', 'success');
  await refreshData();
  render();
}

function buildBudgetChart(){
  const ctx = document.getElementById('budgetChart');
  if(!ctx) return;
  const person = STATE.forecastPerson;
  const cc = chartColors();
  const cats = (STATE.data.settings.Categories||'').split(',').filter(Boolean);
  const actual = monthExpensesByCategory(person); // הוצאות החודש הנבחר בלבד

  // מציגים רק קטגוריות שיש להן תקציב או הוצאה בפועל החודש
  const shown = cats.filter(c=> budgetFor(person,c) > 0 || (actual[c]||0) > 0);
  if(!shown.length) return;

  const budgetData = shown.map(c=> budgetFor(person,c)); // תקציב חודשי
  const actualData = shown.map(c=> actual[c]||0);

  chartInstances.budgetChart = new Chart(ctx, {
    type:'bar',
    data:{ labels:shown, datasets:[
      {label:'תקציב חודשי', data:budgetData, backgroundColor:'#f5a623'},
      {label:'הוצאה החודש', data:actualData, backgroundColor:'#ef5a5a'}
    ]},
    options:{ responsive:true, maintainAspectRatio:false, indexAxis:'y',
      plugins:{legend:{labels:{color:cc.text}}, tooltip:{callbacks:{label:(x)=>x.dataset.label+': '+fmt(x.parsed.x)}}},
      scales:{ x:{ticks:{color:cc.muted}, grid:{color:cc.grid}}, y:{ticks:{color:cc.muted, font:{size:10}}, grid:{color:cc.grid}} } }
  });
}

// עורך קטגוריות - עובד על עותק זמני ב-STATE עד שלוחצים שמור
function getEditCategories(){
  if(!STATE.editCategories){
    STATE.editCategories = (STATE.data.settings.Categories||'').split(',').filter(Boolean);
  }
  return STATE.editCategories;
}

function renderCategoryList(){
  const cats = getEditCategories();
  if(!cats.length) return '<div style="color:var(--muted);padding:10px;">אין קטגוריות</div>';
  return '<div class="catList">' + cats.map((c,i)=>
    `<div class="catChip"><span>${c}</span><button onclick="removeCategory(${i})">✕</button></div>`
  ).join('') + '</div>';
}

function addCategory(){
  const input = document.getElementById('newCatInput');
  const val = input.value.trim();
  if(!val) return;
  const cats = getEditCategories();
  if(cats.includes(val)){ showToast('הקטגוריה כבר קיימת', 'error'); return; }
  cats.push(val);
  input.value = '';
  document.getElementById('catManager').innerHTML = renderCategoryList();
}

function removeCategory(idx){
  const cats = getEditCategories();
  cats.splice(idx,1);
  document.getElementById('catManager').innerHTML = renderCategoryList();
}

async function saveCategories(){
  const cats = getEditCategories();
  const res = await postData({type:'saveCategories', categories:cats});
  if(res.error){ showToast('שגיאה: ' + res.error, 'error'); return; }
  showToast('הקטגוריות נשמרו!', 'success');
  STATE.editCategories = null; // מאפסים כדי שייטען מחדש מהגיליון
  await refreshData();
  render();
}

async function saveAlertEmails(){
  const emailP1 = document.getElementById('alertEmailP1').value.trim();
  const emailP2 = document.getElementById('alertEmailP2').value.trim();
  const res1 = await postData({type:'saveSetting', key:'AlertEmail_'+STATE.person1, value:emailP1});
  const res2 = await postData({type:'saveSetting', key:'AlertEmail_'+STATE.person2, value:emailP2});
  if(res1.error || res2.error){ showToast('שגיאה בשמירה', 'error'); return; }
  STATE.data.settings['AlertEmail_'+STATE.person1] = emailP1;
  STATE.data.settings['AlertEmail_'+STATE.person2] = emailP2;
  showToast('כתובות האימייל נשמרו!', 'success');
}

async function sendTestEmail(person){
  const inputId = person===STATE.person1 ? 'alertEmailP1' : 'alertEmailP2';
  const email = document.getElementById(inputId).value.trim();
  if(!email){ showToast('קודם הזינו כתובת אימייל ל'+person, 'error'); return; }
  showToast('שולח מייל בדיקה...', 'info');
  const res = await postData({type:'testEmail', email, person});

  showToast('מייל בדיקה נשלח ל'+person+'! בדקו את התיבה', 'success');

/* ---------- גיבוי ל-Excel ---------- */
function exportBackup(){
  if(typeof XLSX === 'undefined'){ showToast('ספריית הגיבוי עדיין נטענת, נסו שוב', 'error'); return; }
  const d = STATE.data;
  const wb = XLSX.utils.book_new();

  function addSheet(name, rows){
    if(!rows || !rows.length){
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['אין נתונים']]), name);
      return;
    }
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, name);
  }

  // ממירים כל טבלה לפורמט קריא בעברית
  addSheet('הוצאות', (d.expenses||[]).map(r=>({תאריך:fmtDate(r.Date), סכום:r.Amount, קטגוריה:r.Category, מי:r.Person, פירוט:r.Notes||''})));
  addSheet('הכנסות', (d.income||[]).map(r=>({תאריך:fmtDate(r.Date), מי:r.Person, ברוטו:r.Gross, נטו:r.Net})));
  addSheet('חיסכון', (d.savings||[]).map(r=>({תאריך:fmtDate(r.Date), מי:r.Person, סכום:r.Amount})));
  addSheet('תקציבים', (d.budgets||[]).map(r=>({מי:r.Person, קטגוריה:r.Category, תקציב_חודשי:r.Amount})));
  addSheet('טיולים', (d.trips||[]).map(r=>({שם:r.Name, מיקום:r.Location, יעד:r.Destination, קטגוריה:r.Category, סכום:r.Amount})));
  addSheet('השקעות', (d.investments||[]).map(r=>({תאריך:fmtDate(r.Date), חברה:r.Company, סכום:r.Amount})));
  addSheet('נכסים', (d.assets||[]).map(r=>({סוג:r.Type, שם:r.Name, סכום:r.Amount})));
  addSheet('משאלות', (d.wishlist||[]).map(r=>({פריט:r.Item, מחיר:r.Price, נקנה:r.Bought?'כן':'לא'})));
  addSheet('יעדים', (d.goals||[]).map(r=>({שם:r.Name, יעד:r.Target, נחסך:r.Saved})));

  const today = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `גיבוי_הוצאות_${today}.xlsx`);
}

function fmtDate(dt){
  if(!dt) return '';
  const d = new Date(dt);
  if(isNaN(d)) return dt;
  return d.toLocaleDateString('he-IL');
}

/* ---------- שליחת סיכום לוואטסאפ ---------- */
function monthSummaryText(monthIdx, who){
  const year = STATE.currentYear;
  const inMonth = r => { const d = new Date(r.Date); return d.getMonth()===monthIdx && d.getFullYear()===year; };
  const inYear = r => new Date(r.Date).getFullYear()===year;

  const exp = (STATE.data.expenses||[]).filter(inMonth);
  const inc = (STATE.data.income||[]).filter(inMonth);
  const savMonth = (STATE.data.savings||[]).filter(inMonth);
  const savYear = (STATE.data.savings||[]).filter(inYear);

  function forPerson(arr, key, person){
    if(who==='both') return sum(arr, key);
    const target = who==='p1' ? STATE.person1 : STATE.person2;
    return sum(arr.filter(r=>r.Person===target), key);
  }

  const totalExp = forPerson(exp, 'Amount');
  const totalInc = forPerson(inc, 'Net');
  const savedThisMonth = forPerson(savMonth, 'Amount');
  const savedThisYear = forPerson(savYear, 'Amount');
  const balance = totalInc - totalExp;

  let whoLabel;
  if(who==='both') whoLabel = STATE.person1 + ' ו' + STATE.person2;
  else if(who==='p1') whoLabel = STATE.person1;
  else whoLabel = STATE.person2;

  let msg = `💰 *סיכום ${MONTHS[monthIdx]} ${year}* — ${whoLabel}\n\n`;
  msg += `📥 הכנסות: ${fmt(totalInc)}\n`;
  msg += `📤 הוצאות: ${fmt(totalExp)}\n`;
  msg += `${balance>=0 ? '✅' : '⚠️'} מאזן החודש: ${fmt(balance)}\n\n`;
  msg += `💰 הופקד לחיסכון החודש: ${fmt(savedThisMonth)}\n`;
  msg += `🏦 סה"כ בחיסכון השנה: ${fmt(savedThisYear)}\n`;
  msg += `🎯 יעד שנתי: ${fmt(STATE.goal)}`;
  return msg;
}

function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(()=>{});
  }
}

// אנימציית מטבעות שנופלים לתוך הכספת הראשית
function dropCoinsToVault(){
  const vault = document.querySelector('.vaultSvg') || document.querySelector('#mainVault');
  const target = vault ? vault.getBoundingClientRect() : null;
  const tx = target ? target.left + target.width/2 : window.innerWidth/2;
  const ty = target ? target.top + target.height/2 : window.innerHeight/2;
  for(let i=0;i<8;i++){
    const coin = document.createElement('div');
    coin.textContent = '🪙';
    coin.style.cssText = 'position:fixed;left:'+tx+'px;top:-40px;font-size:26px;z-index:9998;pointer-events:none;';
    document.body.appendChild(coin);
    const delay = i*90;
    const drift = (Math.random()-0.5)*80;
    coin.animate([
      {transform:'translate('+drift+'px,0) rotate(0deg)', opacity:0},
      {transform:'translate('+drift*0.5+'px,'+(ty*0.4)+'px) rotate(180deg)', opacity:1, offset:0.3},
      {transform:'translate(0,'+ty+'px) rotate(360deg) scale(0.4)', opacity:0}
    ],{duration:1100, delay:delay, easing:'cubic-bezier(.4,0,.6,1)'}).onfinish = ()=> coin.remove();
  }
}

/* ---------- מודל כללי ---------- */
/* ---------- ספירת מספרים עולה ---------- */
function animateCountUp(){
  // מנפיש את כל המספרים באתר - כרטיסים (.val) וגם שורות רשימה (.amt)
  const els = document.querySelectorAll('.val');
  els.forEach(function(el){
    if(el.dataset.counted === '1') return; // כבר הונפש
    const raw = el.textContent.trim();
    // מחלצים את המספר מתוך הטקסט (למשל "₪12,500" -> 12500)
    const num = Number(raw.replace(/[^0-9.-]/g, ''));
    if(!num || isNaN(num) || Math.abs(num) < 1){ return; }
    el.dataset.counted = '1';
    const prefix = raw.match(/^[^\d-]*/)[0]; // סימן ₪ אם יש
    const isNeg = num < 0;
    const target = Math.abs(num);
    const duration = 850;
    const start = performance.now();
    function frame(now){
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      const current = Math.round(target * eased);
      el.textContent = prefix + (isNeg?'-':'') + current.toLocaleString();
      if(p < 1) requestAnimationFrame(frame);
      else el.textContent = raw; // מחזירים את הפורמט המקורי המדויק
    }
    requestAnimationFrame(frame);
  });
}

/* ---------- טוסט (הודעות מונפשות) ---------- */
function showToast(message, type){
  type = type || 'success';
  const icons = { success:'✓', error:'⚠️', info:'ℹ️' };
  const container = document.getElementById('toastContainer');
  if(!container) { alert(message); return; }
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = '<span class="tIcon">' + (icons[type]||'') + '</span><span>' + message + '</span>';
  container.appendChild(t);
  requestAnimationFrame(()=> t.classList.add('show'));
  setTimeout(()=>{
    t.classList.remove('show');
    setTimeout(()=> t.remove(), 300);
  }, 3000);
}

/* ---------- אפקט גל בלחיצה ---------- */
document.addEventListener('click', function(e){
  const btn = e.target.closest('button');
  if(!btn) return;
  if(btn.classList.contains('delBtn') || btn.classList.contains('close')) return;
  btn.classList.add('rippleWrap');
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const dot = document.createElement('span');
  dot.className = 'rippleDot';
  dot.style.width = dot.style.height = size + 'px';
  dot.style.left = (e.clientX - rect.left - size/2) + 'px';
  dot.style.top = (e.clientY - rect.top - size/2) + 'px';
  btn.appendChild(dot);
  setTimeout(()=> dot.remove(), 600);
});

function showModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
}
document.addEventListener('click', (e)=>{
  if(e.target.id === 'modalOverlay') closeModal();
});
